<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>synqalia · Equipo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22%23121821%22/%3E%3Cg transform=%22translate%287 7%29%22%3E%3Ccircle cx=%2221%22 cy=%2220%22 r=%229.5%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%226%22/%3E%3Cpath d=%22M30.5 20v16%22 stroke=%22%23fff%22 stroke-width=%226%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2230.5%22 cy=%2244%22 r=%223.6%22 fill=%22%235fe0cf%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: barra lateral con grupos de trabajo y tableros + área de trabajo; ficha lateral para cada elemento. En móvil la barra lateral se pliega. */
  :root {
    --ink:#141a2e; --muted:#5d6680; --line:#dfe3ee; --panel:#fff; --bg:#f3f5fa; --soft:#f7f8fc;
    --accent:#2340d0; --accent-soft:#e6eafc; --bad:#c62f3b; --warn:#b16a00; --ok:#1f7a4c;
    --display:"Instrument Serif", Georgia, serif; --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root {
    --ink:#e8ebf5; --muted:#98a1bb; --line:#2a3148; --panel:#171c2c; --bg:#0f1320; --soft:#131829;
    --accent:#7f95ff; --accent-soft:#222b4d; --bad:#ff7b84; --warn:#f0b04a; --ok:#5fd39a; color-scheme: dark; } }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font:15px/1.45 var(--body); }
  button,input,select,textarea { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  a { color:var(--accent); }
  .hidden { display:none !important; }

  /* login */
  .login { min-height:100%; display:grid; place-items:center; padding:24px; }
  .login-card { width:min(420px,100%); background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px; display:grid; gap:16px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand h1 { font:400 30px/1 var(--display); margin:0; }
  .brand small { color:var(--muted); font-size:13px; display:block; margin-top:2px; }
  .linkbtn { background:none; border:0; color:var(--muted); cursor:pointer; font:inherit; font-size:13px; text-decoration:underline; padding:0; justify-self:center; }
  .linkbtn:hover { color:var(--ink); }
  .seg { display:flex; gap:4px; background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:3px; }
  .seg button { flex:1; border:0; background:transparent; padding:7px; border-radius:8px; cursor:pointer; color:var(--muted); font-weight:500; }
  .seg button[aria-selected="true"] { background:var(--panel); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }

  .field { display:grid; gap:4px; }
  .field > span { font-size:12px; color:var(--muted); font-weight:500; }
  .input, .field input, .field select, .field textarea { border:1px solid var(--line); background:var(--soft); border-radius:9px; padding:8px 10px; width:100%; }
  .field textarea { min-height:80px; resize:vertical; }
  .msg { font-size:13px; color:var(--muted); min-height:18px; }
  .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }

  .btn { border:1px solid var(--line); background:var(--panel); border-radius:9px; padding:7px 13px; cursor:pointer; font-size:14px; font-weight:500; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { filter:brightness(1.08); color:#fff; }
  .btn.ghost { border-color:transparent; background:transparent; color:var(--muted); }
  .btn.ghost:hover { color:var(--ink); }
  .btn.danger:hover { border-color:var(--bad); color:var(--bad); }
  .btn.sm { padding:4px 9px; font-size:13px; }
  .btn:disabled { opacity:.5; cursor:default; }

  /* shell */
  .shell { display:grid; grid-template-columns:250px 1fr; height:100vh; }
  .side { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .side .brand { padding:16px 16px 10px; }
  .side .brand h1 { font-size:24px; }
  .nav { overflow:auto; padding:6px 10px 16px; display:grid; gap:2px; align-content:start; flex:1; }
  .nav .sec { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:14px 8px 4px; font-weight:600; display:flex; justify-content:space-between; }
  .nav button { text-align:left; border:0; background:transparent; padding:7px 10px; border-radius:8px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--ink); }
  .nav button:hover { background:var(--soft); }
  .nav button[aria-current="true"] { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .nav button.ng { margin-top:12px; border:1px dashed rgba(255,255,255,.22); justify-content:center; color:var(--muted); }
  .nav button.ng:hover { color:var(--accent); border-color:var(--accent); }
  .nav .n { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .me { border-top:1px solid var(--line); padding:12px 14px; display:flex; align-items:center; gap:10px; font-size:13px; }
  .me .who { flex:1; min-width:0; } .me .who b { display:block; } .me .who span { color:var(--muted); overflow:hidden; text-overflow:ellipsis; display:block; white-space:nowrap; }

  .main { min-width:0; min-height:0; overflow:auto; }
  .page { padding:22px 26px 60px; display:grid; gap:18px; max-width:1500px; }
  .head { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .head h2 { font:400 34px/1 var(--display); margin:0; }
  .head p { margin:4px 0 0; color:var(--muted); font-size:14px; }
  .head .grow { flex:1; min-width:200px; }
  .menu-btn { display:none; }
  .mi-switch { display:none; }
  .side-backdrop { display:none; }
  @media (max-width: 860px) {
    .mi-switch { display:inline-flex; align-items:center; gap:4px; margin:0 0 8px; padding:5px 11px; font-size:12px !important; border-radius:999px; border:1px solid rgba(95,224,207,.45); background:rgba(95,224,207,.12); color:#fff; font-weight:700; font-size:13px; text-decoration:none; }
    .mi-switch:active { background:rgba(95,224,207,.24); }
    .side-backdrop.open { display:block; position:fixed; inset:0; z-index:29; background:rgba(5,10,20,.45); }
  }
  @media (max-width: 860px) {
    .shell { grid-template-columns:1fr; }
    .side { position:fixed; inset:0 auto 0 0; width:270px; z-index:30; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 40px rgba(0,0,0,.2); }
    .side.open { transform:none; }
    .menu-btn { display:inline-flex; }
    .page { padding:14px 12px 60px; }
  }

  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .toolbar .input { width:auto; min-width:200px; flex:1; max-width:340px; background:var(--panel); }
  .toolbar select.input { flex:none; min-width:0; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .toolbar.tb-main { flex-wrap:nowrap; }
  .toolbar.tb-main .input { max-width:none; min-width:0; }
  .tb-ftog { flex:none; white-space:nowrap; }
  .tb-ftog .tb-n { display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--accent, #2b4fd8); color:#fff; font-size:11px; font-weight:700; }
  .tb-ftog .tb-car { opacity:.6; font-size:11px; }
  .tb-seg { flex:none; }
  .toolbar.tb-more { margin-top:8px; padding:10px; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
  .toolbar.tb-more[hidden] { display:none; }
  @media (max-width:860px) {
    .toolbar.tb-more .input { flex:1 1 140px; }
    .band .head p { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:calc(100vw - 120px); }
  }
  .tb-seg-more { display:none; }
  @media (max-width:560px) { .toolbar.tb-main .tb-seg { display:none; } .tb-seg-more { display:flex; } .toolbar.tb-main { gap:6px; } }
  .page { grid-template-columns:minmax(0,1fr); }
  .page > * { min-width:0; }
  .shell { grid-template-columns:250px minmax(0,1fr); }
  .card, .kpi, .grid2 > *, .r > *, .bar > *, .kc, .feed .r > * { min-width:0; overflow-wrap:anywhere; }
  .grid2 { grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr)); }
  .r > .tag { align-self:start; justify-self:end; overflow-wrap:normal; }
  .kpis { grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr)); }
  @media (max-width:860px) { .shell { grid-template-columns:minmax(0,1fr); } .main { overflow-x:hidden; } html, body { overflow-x:hidden; max-width:100vw; } }
  .toolbar.tb-more .input { min-width:0; }
  @media (max-width:860px) {
    .band .head { flex-wrap:nowrap; align-items:center; }
    .band .head .grow { min-width:0; }
    .band .head > .btn:not(.menu-btn) { flex:none; padding-left:10px; padding-right:10px; }
    .band .head #bmenu { font-size:0; } .band .head #bmenu::before { content:'⋯'; font-size:18px; line-height:1; }
    .tablewrap { max-height:calc(100vh - 200px); }
  }
  .chip { border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:4px 11px; font-size:13px; cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }

  /* KPIs */
  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:2px; text-align:left; }
  button.kpi { cursor:pointer; } button.kpi:hover { border-color:var(--accent); }
  .kpi b { font:400 32px/1.05 var(--display); font-variant-numeric:tabular-nums; }
  .kpi span { color:var(--muted); font-size:13px; }
  .kpi.alert { border-left:4px solid var(--bad); }
  .kpi.warnk { border-left:4px solid var(--warn); }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; display:grid; gap:12px; min-width:0; }
  .card h3 { margin:0; font-size:16px; font-weight:600; }
  .card .sub { color:var(--muted); font-size:13px; margin:0; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); gap:14px; }
  @media (max-width:500px){ .grid2 { grid-template-columns:1fr; } }

  .bars { display:grid; gap:7px; }
  .bar { display:grid; grid-template-columns:minmax(120px,1.1fr) 2fr 44px; gap:10px; align-items:center; font-size:13px; cursor:pointer; }
  .bar .track { height:10px; background:var(--soft); border-radius:6px; overflow:hidden; }
  .bar .fill { height:100%; border-radius:6px; }
  .bar .v { text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); }

  .rows { display:grid; }
  .r { display:grid; grid-template-columns:1fr auto; gap:4px 10px; padding:9px 2px; border-top:1px solid var(--line); cursor:pointer; }
  .r:first-child { border-top:0; }
  .r:hover .t { color:var(--accent); }
  .r .t { font-weight:600; }
  .r .d { color:var(--muted); font-size:13px; grid-column:1 / -1; }
  .feed .r { cursor:default; grid-template-columns:28px 1fr auto; }
  .feed .r .d { grid-column:2 / -1; }

  /* pills */
  .pill { display:inline-flex; align-items:center; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; color:#fff; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .pill.empty { background:transparent; color:var(--muted); border:1px dashed var(--line); font-weight:500; }
  .tag { font-size:12px; padding:1px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; }
  .tag.late { background:var(--bad); color:#fff; }
  .tag.muted { background:var(--soft); color:var(--muted); }
  .av { width:24px; height:24px; border-radius:50%; display:inline-grid; place-items:center; color:#fff; font-size:11px; font-weight:700; flex:none; }
  .avs { display:inline-flex; gap:2px; }

  /* table */
  .tablewrap { overflow:auto; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
  table.grid { border-collapse:separate; border-spacing:0; width:100%; font-size:13.5px; }
  table.grid th { position:sticky; top:0; background:var(--soft); text-align:left; font-weight:600; font-size:12px; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; z-index:1; }
  table.grid td { padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:middle; max-width:260px; }
  table.grid td.txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table.grid td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.grid tr.item:hover td { background:var(--soft); }
  table.grid td.name { position:sticky; left:0; background:var(--panel); font-weight:600; min-width:230px; max-width:340px; cursor:pointer; border-left:4px solid var(--gc,transparent); }
  table.grid tr.item:hover td.name { background:var(--soft); color:var(--accent); }
  table.grid th.name { position:sticky; left:0; z-index:2; }
  .nm { display:flex; align-items:center; gap:6px; } .nm span.t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nm .cnt { font-size:11px; color:var(--muted); font-weight:500; border:1px solid var(--line); border-radius:6px; padding:0 5px; flex:none; }
  tr.grp td { background:var(--panel); padding:14px 10px 6px; border-bottom:2px solid var(--gc); position:sticky; left:0; }
  tr.grp .gt { display:flex; align-items:center; gap:8px; font-weight:700; color:var(--gc); cursor:pointer; position:sticky; left:10px; width:max-content; }
  tr.grp .gt .n { color:var(--muted); font-weight:500; font-size:13px; }
  tr.add td { padding:4px 10px 10px; border-bottom:0; }
  select.stsel { border:0; border-radius:999px; padding:2px 8px; font-size:12px; font-weight:600; color:#fff; cursor:pointer; max-width:170px; appearance:none; -webkit-appearance:none; text-align:center; }
  select.stsel.empty { background:var(--soft); color:var(--muted); border:1px dashed var(--line); }

  /* kanban */
  .kanban { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(260px,280px); gap:12px; overflow-x:auto; padding-bottom:8px; align-items:start; }
  .col { background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:10px; display:grid; gap:8px; align-content:start; max-height:75vh; overflow:auto; }
  .col h4 { margin:0; font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .col h4 i { width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:6px; }
  .kc { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; display:grid; gap:6px; cursor:pointer; font-size:13px; }
  .kc:hover { border-color:var(--accent); }
  .kc b { font-size:14px; }
  .kc .meta { display:flex; gap:5px; flex-wrap:wrap; align-items:center; color:var(--muted); }
  .col.drop { outline:2px dashed var(--accent); }

  /* drawer */
  .scrim { position:fixed; inset:0; background:rgba(10,14,30,.35); z-index:40; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(640px,100%); background:var(--panel); z-index:41; display:flex; flex-direction:column; box-shadow:-10px 0 40px rgba(0,0,0,.15); }
  .dh { padding:16px 18px 10px; border-bottom:1px solid var(--line); display:grid; gap:8px; }
  .dh .top { display:flex; gap:8px; align-items:center; }
  .dh input.title { font:400 26px/1.15 var(--display); border:1px solid transparent; background:transparent; padding:2px 4px; border-radius:8px; flex:1; min-width:0; }
  .dh input.title:hover, .dh input.title:focus { border-color:var(--line); }
  .db { overflow:auto; padding:14px 18px 40px; display:grid; gap:18px; align-content:start; }
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin:0 -18px; padding:0 18px; }
  .tabs button { border:0; background:transparent; padding:8px 10px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; font-weight:500; }
  .tabs button[aria-selected="true"] { color:var(--accent); border-bottom-color:var(--accent); }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; }
  .fields .wide { grid-column:1 / -1; }
  @media (max-width:520px){ .fields { grid-template-columns:1fr; } }
  .subs { display:grid; gap:8px; }
  .subc { border:1px solid var(--line); border-radius:10px; padding:10px; display:grid; gap:8px; }
  .subc .sh { display:flex; gap:8px; align-items:center; }
  .subc .sh input { flex:1; font-weight:600; border:1px solid transparent; background:transparent; padding:3px 5px; border-radius:6px; min-width:0; }
  .subc .sh input:hover, .subc .sh input:focus { border-color:var(--line); }
  .subc .fields { grid-template-columns:repeat(3,1fr); gap:8px; }
  @media (max-width:520px){ .subc .fields { grid-template-columns:1fr 1fr; } }
  .subc.done { opacity:.6; }
  .comment { border-top:1px solid var(--line); padding:10px 0; display:grid; grid-template-columns:28px 1fr; gap:8px; }
  .comment .cb { white-space:pre-wrap; font-size:14px; }
  .comment .cm { color:var(--muted); font-size:12px; }
  .files a { display:block; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .modal { position:fixed; inset:0; display:grid; place-items:center; z-index:60; background:rgba(10,14,30,.4); padding:16px; }
  .modal .box { background:var(--panel); border-radius:14px; padding:20px; width:min(440px,100%); display:grid; gap:14px; border:1px solid var(--line); }
  .modal h3 { margin:0; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:10px; font-size:14px; z-index:70; }
  .empty { color:var(--muted); padding:8px 2px; font-size:14px; }
  .loading { color:var(--muted); padding:40px; text-align:center; }
  .code { font-family:ui-monospace,Menlo,monospace; background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:2px 7px; letter-spacing:.08em; }

  /* ===== Identidad synqalia ===== */
  :root {
    --ink:#0e1116; --muted:#5f6b7f; --line:#e3e6ec; --panel:#fff; --bg:#f4f5f8; --soft:#f7f8fb;
    --accent:#2b4fd8; --accent-soft:#e8edfd; --bad:#b4232f; --warn:#a76400; --ok:#1d7a4b;
    --navy:#0d1015; --navy-2:#161b23; --gold:#1fb5a3; --gold-2:#5fe0cf;
    --shadow:0 1px 2px rgba(13,27,51,.04), 0 6px 20px rgba(13,27,51,.05);
    --display:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif; --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --glow: radial-gradient(900px 260px at 78% -30%, rgba(56,208,189,.16), transparent 60%), radial-gradient(700px 240px at 10% -50%, rgba(43,79,216,.22), transparent 60%), linear-gradient(180deg, var(--navy-2), var(--navy));
  }
  @media (prefers-color-scheme: dark) { :root { --ink:#e7ebf3; --muted:#9aa5b8; --line:#263149; --panel:#121a2b; --bg:#0a101c; --soft:#0f1626; --accent:#8ea6ff; --accent-soft:#1b2440; --bad:#ff7a85; --warn:#f0b04a; --ok:#5fd39a; --navy:#05070a; --navy-2:#0e131b; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); } }
  body { font-size:14.5px; letter-spacing:-.003em; -webkit-font-smoothing:antialiased; }
  svg.mark { color:#fff; flex:none; }
  svg.mark .mark-dot { fill:var(--gold-2); }
  .wordmark h1 .alia { color:var(--gold-2); }
  .wordmark h1 { font:700 27px/1 var(--display); letter-spacing:-.02em;  color:#fff; margin:0; }
  .wordmark .tagline { margin-top:4px; font-size:12px; font-weight:500; color:rgba(255,255,255,.6); }

  /* login */
  .login { background:var(--glow); min-height:100vh; }
  .login-card { background:transparent; border:0; padding:0; gap:22px; }
  .login-card .brand { justify-content:center; padding-bottom:4px; }
  .login-card .brand .wordmark h1 { font-size:34px; }
  .login-box { background:var(--panel); border-radius:16px; padding:24px; display:grid; gap:14px; box-shadow:0 20px 60px rgba(0,0,0,.35); }

  /* barra lateral oscura */
  .side { background:var(--glow); border-right:0; color:#fff; }
  .side .brand { padding:20px 18px 14px; gap:12px; }

const ago = (t) => { const s = (Date.now() - new Date(t)) / 1000; if (s < 60) return 'ahora'; if (s < 3600) return `hace ${Math.floor(s/60)} min`; if (s < 86400) return `hace ${Math.floor(s/3600)} h`; if (s < 86400*7) return `hace ${Math.floor(s/86400)} d`; return fmtD(new Date(t).toISOString()); };

/* ---------------- auth ---------------- */
const nextUrl = () => { const n = new URLSearchParams(location.search).get('next'); return n === 'mi.html' ? 'mi.html' : null; };
// Al entrar en synqalia se abre Mi trabajo (admin o quien no tiene espacios de equipo); al Equipo se va con ?z=equipo
const wantEquipo = () => new URLSearchParams(location.search).get('z') === 'equipo';
async function homeIsMi() {

  try {

}

const MS_ICON = '<svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>';

function renderLogin(mode = 'ms', msg = '', cls = '') {
  const oauthErr = new URLSearchParams(location.hash.slice(1) || location.search).get('error_description');
  if (oauthErr && !msg) { msg = 'No se pudo entrar con Microsoft: ' + oauthErr; cls = 'err'; }

      <label class="field"><span>Código de invitación</span><input name="code" required autocomplete="one-time-code" placeholder="Te lo envía Jaime"></label>

function boardFilter(b) { return S.filters[b.id] || (S.filters[b.id] = { q: '', group: null, status: null, closed: false, late: false, mode: b.kind === 'pipeline' || b.kind === 'leads' ? 'table' : 'table', person: null }); }
function visibleCols(b) { return b.columns.filter((c) => !c.hidden); }
const DEFW = { status: 150, date: 115, number: 125, text: 190, long_text: 240, files: 100, people: 100, link: 160 };
const colW = (c) => c.width || DEFW[c.type] || 170;
function filteredItems(b) {
  const f = boardFilter(b); const q = f.q.trim().toLowerCase();
  const st = statusCol(b.columns);
  return topItems(b.id).filter((i) => {
    if (f.group && i.group_id !== f.group) return false;
    if (!f.closed && !f.group && isClosed(b, i)) return false;
    if (f.status && !Object.values(i.data).includes(f.status) && !subsOf(i.id).some((s) => Object.values(s.data).includes(f.status))) return false;
    if (f.late) { const late = overdueOf(b, i, b.columns) || subsOf(i.id).some((s) => overdueOf(b, s, b.sub_columns)); if (!late) return false; }
    if (f.person) { const has = JSON.stringify(i.data).includes(f.person) || subsOf(i.id).some((s) => JSON.stringify(s.data).includes(f.person)); if (!has) return false; }
    if (q) { const hay = (i.name + ' ' + Object.values(i.data).join(' ') + ' ' + subsOf(i.id).map((s) => s.name + ' ' + Object.values(s.data).join(' ')).join(' ')).toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
}
function cellHtml(c, v) {
  if (v == null || v === '' || (Array.isArray(v) && !v.length)) return c.type === 'status' ? '<span class="pill empty">—</span>' : '';
  switch (c.type) {
    case 'status': return pill(c, v);
    case 'date': return `<span class="${v < today() ? '' : ''}">${fmtD(v)}</span>`;
    case 'number': return /presupuesto|pendiente|canon|deuda/.test(c.key) ? fmtE(v) : fmtN(v);
    case 'people': return `<span class="avs">${(v || []).map(avatar).join('')}</span>`;
    case 'files': return `${v.length} 📎`;
    default: return esc(v);
  }
}
function renderBoard(el, b) {

  el.querySelector('#fc')?.addEventListener('click', () => { f.closed = !f.closed; renderMain(); });
  el.querySelector('#clr')?.addEventListener('click', (e) => { e.preventDefault(); Object.assign(f, { q: '', group: null, status: null, late: false, person: null }); renderMain(); });

  el.querySelectorAll('button.addin').forEach((x) => x.onclick = () => newItem(b, x.dataset.g));

  el.querySelectorAll('.rz').forEach((rz) => rz.onmousedown = (e) => startResize(e, b, rz.dataset.rz, el));
  // mantener la posición horizontal de la tabla entre repintados
  const tw = el.querySelector('#tw'); if (tw) { tw.scrollLeft = S.hscroll?.[b.id] || 0; tw.onscroll = () => { (S.hscroll ||= {})[b.id] = tw.scrollLeft; }; }

async function saveBoard(b, patch) {
  Object.assign(b, patch);
  const { error } = await sb.from('boards').update(patch).eq('id', b.id);
  if (error) err(error);
}
function startResize(e, b, key, root) {
  e.preventDefault(); e.stopPropagation();
  const colEl = root.querySelector(`col[data-c="${CSS.escape(key)}"]`); const table = root.querySelector('table.grid');
  const startX = e.clientX; const startW = colEl.getBoundingClientRect().width || parseInt(colEl.style.width); const startT = parseInt(table.style.width);
  document.body.classList.add('resizing');
  const move = (ev) => { const w = Math.max(70, Math.round(startW + ev.clientX - startX)); colEl.style.width = w + 'px'; table.style.width = (startT + w - startW) + 'px'; };
  const up = async () => {
    document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); document.body.classList.remove('resizing');
    const w = parseInt(colEl.style.width);
    if (key === '__name') await saveBoard(b, { settings: { ...(b.settings || {}), name_width: w } });
    else await saveBoard(b, { columns: b.columns.map((c) => c.key === key ? { ...c, width: w } : c) });
  };
  document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
}
const PALETTE = ['#579bfc', '#00c875', '#fdab3d', '#df2f4a', '#9d50dd', '#037f4c', '#ff5ac4', '#cab641', '#007eb5', '#7f5347', '#66ccff', '#784bd1'];
const TYPES = { text: 'Texto', long_text: 'Texto largo', number: 'Número', date: 'Fecha', status: 'Estado / desplegable', people: 'Persona', files: 'Enlaces / documentos' };
function slugKey(b, title) {
  let base = title.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'col';
  let k = base, i = 2; while (b.columns.some((c) => c.key === k)) k = `${base}_${i++}`; return k;
}
function formModal(title, inner, okText = 'Guardar') {
  return new Promise((res) => {
    const r = document.getElementById('modal-root');
    r.innerHTML = `<div class="modal"><form class="box"><h3>${esc(title)}</h3>${inner}<div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" id="cx">Cancelar</button><button class="btn primary">${esc(okText)}</button></div></form></div>`;
    const f = r.querySelector('form'); f.querySelector('input,select,textarea')?.focus();
    const done = (v) => { r.innerHTML = ''; res(v); };
    f.onsubmit = (e) => { e.preventDefault(); done(Object.fromEntries(new FormData(f))); };
    r.querySelector('#cx').onclick = () => done(null);
    f.querySelector('[name=type]')?.addEventListener('change', (e) => f.querySelector('#optbox').classList.toggle('hidden', e.target.value !== 'status'));
  });
}
async function addColumn(b) {
  const v = await formModal('Añadir columna', `
    <label class="field"><span>Nombre de la columna</span><input name="title" required></label>
    <label class="field"><span>Tipo</span><select name="type">${Object.entries(TYPES).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></label>
    <label class="field hidden" id="optbox"><span>Opciones (una por línea)</span><textarea name="options" placeholder="Pendiente\nEn curso\nHecho"></textarea></label>`, 'Añadir');
  if (!v || !v.title.trim()) return;
  const col = { key: slugKey(b, v.title.trim()), title: v.title.trim(), type: v.type };
  if (v.type === 'status') col.options = (v.options || '').split('\n').map((x) => x.trim()).filter(Boolean).map((label, i) => ({ label, color: PALETTE[i % PALETTE.length] }));
  await saveBoard(b, { columns: [...b.columns, col] });
  toast('Columna añadida'); renderMain();
  const tw = document.getElementById('tw'); if (tw) tw.scrollLeft = tw.scrollWidth;
}
async function editOptions(b, key) {
  const c = b.columns.find((x) => x.key === key);
  const v = await formModal(`Etiquetas de «${c.title}»`, `<label class="field"><span>Una etiqueta por línea (el orden es el del desplegable)</span><textarea name="options" style="min-height:180px">${esc((c.options || []).map((o) => o.label).join('\n'))}</textarea></label>`);
  if (!v) return;
  const labels = v.options.split('\n').map((x) => x.trim()).filter(Boolean);
  const options = labels.map((label, i) => ({ label, color: c.options?.find((o) => o.label === label)?.color || PALETTE[i % PALETTE.length] }));

}

function tableHtml(b, its, cols) {

/* ---------------- mutations ---------------- */
async function updateItem(id, patch) {
  const it = S.items.find((i) => i.id === id); if (!it) return;
  const prev = { ...it }; Object.assign(it, patch); scheduleRender();
  const { data, error } = await sb.from('items').update(patch).eq('id', id).select().single();
  if (error) { Object.assign(it, prev); scheduleRender(); return err(error); }
  Object.assign(it, data);
}
async function setField(id, key, value) {
  const it = S.items.find((i) => i.id === id); if (!it) return;
  const data = { ...it.data };
  if (value == null || value === '' || (Array.isArray(value) && !value.length)) delete data[key]; else data[key] = value;
  await updateItem(id, { data });
}
async function newItem(b, groupId, parentId = null) {
  const name = await ask(parentId ? 'Nueva subtarea' : `Nuevo elemento en ${b.name}`, parentId ? 'Nombre de la subtarea' : 'Nombre');
  if (!name) return;
  const sibs = parentId ? subsOf(parentId) : topItems(b.id);
  const pos = parentId ? (Math.max(0, ...sibs.map((s) => s.position)) + 1) : (Math.min(1, ...sibs.map((s) => s.position)) - 1);
  const row = { board_id: b.id, group_id: parentId ? null : groupId, parent_id: parentId, name, data: {}, position: pos };
  const { data, error } = await sb.from('items').insert(row).select().single();
  if (error) return err(error);
  if (!S.items.find((i) => i.id === data.id)) S.items.push(data);
  renderMain();
  if (!parentId) openItem(data.id); else renderDrawer();
}
async function deleteItem(id) {
  const it = S.items.find((i) => i.id === id);
  if (!(await confirmBox(`¿Eliminar «${it.name}»?`, it.parent_id ? 'Se borrará la subtarea.' : 'Se borrarán también sus subtareas y comentarios. No se puede deshacer.'))) return;
  const { error } = await sb.from('items').delete().eq('id', id);
  if (error) return err(error);
  S.items = S.items.filter((i) => i.id !== id && i.parent_id !== id);
  if (S.open === id) closeDrawer(); else renderDrawer();
  renderMain();
}

/* ---------------- dialogs ---------------- */
function ask(title, label, value = '') {
  return new Promise((res) => {
    const r = document.getElementById('modal-root');
    r.innerHTML = `<div class="modal"><form class="box"><h3>${esc(title)}</h3><label class="field"><span>${esc(label)}</span><input name="v" value="${esc(value)}" required></label><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" id="cx">Cancelar</button><button class="btn primary">Aceptar</button></div></form></div>`;
    const f = r.querySelector('form'); f.v.focus();
    const done = (v) => { r.innerHTML = ''; res(v); };
    f.onsubmit = (e) => { e.preventDefault(); done(f.v.value.trim()); };
    r.querySelector('#cx').onclick = () => done(null);
    r.querySelector('.modal').onclick = (e) => { if (e.target.classList.contains('modal')) done(null); };
  });
}
function confirmBox(title, text) {
  return new Promise((res) => {
    const r = document.getElementById('modal-root');
    r.innerHTML = `<div class="modal"><div class="box"><h3>${esc(title)}</h3><p class="sub" style="margin:0;color:var(--muted)">${esc(text)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="cx">Cancelar</button><button class="btn primary" id="ok">Confirmar</button></div></div></div>`;
    const done = (v) => { r.innerHTML = ''; res(v); };
    r.querySelector('#cx').onclick = () => done(false); r.querySelector('#ok').onclick = () => done(true);
  });
}

async function openItem(id) {

  if (it.parent_id) id = it.parent_id;
  S.open = id; S.drawerTab = 'datos'; renderDrawer();
  if (!S.comments[id]) {
    const { data } = await sb.from('comments').select('*').eq('item_id', id).order('created_at');
    S.comments[id] = data || []; if (S.open === id) renderDrawer();
  }
}
function closeDrawer() { S.open = null; document.getElementById('drawer-root').innerHTML = ''; }
function fieldInput(c, it, prefix = '') {
  const v = it.data[c.key]; const id = `${prefix}${it.id}-${c.key}`;
  const attrs = `data-id="${it.id}" data-k="${esc(c.key)}" data-t="${c.type}" id="${id}"`;
  let inp;
  switch (c.type) {

    case 'date': inp = `<input type="date" ${attrs} value="${esc(v || '')}">`; break;
    case 'number': inp = `<input type="number" step="any" inputmode="decimal" ${attrs} value="${v ?? ''}">`; break;
    case 'people': inp = `<select ${attrs}><option value="">—</option>${S.members.map((m) => `<option value="${esc(m.email)}" ${(v || []).map((x) => x.toLowerCase()).includes(m.email.toLowerCase()) ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>`; break;
    case 'files': inp = `<textarea ${attrs} placeholder="Un enlace por línea (SharePoint, Drive…)">${esc((v || []).join('\n'))}</textarea>${(v || []).length ? `<div class="files">${v.map((u) => /^https?:/.test(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(decodeURIComponent(u.split('/').pop().split('?')[0]) || u)}</a>` : `<span>${esc(u)}</span>`).join('')}</div>` : ''}`; break;
    case 'long_text': inp = `<textarea ${attrs}>${esc(v || '')}</textarea>`; break;

  const wide = ['long_text', 'files'].includes(c.type) || /comentario|siguiente|accion|conclusi|notas/.test(c.key);

  ${data.map((m) => `<tr><td><span style="display:flex;gap:8px;align-items:center">${avatar(m.email)} <b>${esc(m.name)}</b></span></td><td class="txt">${esc(m.email)}</td><td>${m.role === 'admin' ? 'Administrador' : 'Miembro'}</td>
    ${S.spaces.map((s) => `<td>${m.role === 'admin' ? 'Todo' : `<input type="checkbox" data-sp="${esc(s.id)}" data-em="${esc(m.email)}" ${S.spaceMembers.some((x) => x.space_id === s.id && x.email.toLowerCase() === m.email.toLowerCase()) ? 'checked' : ''}>`}</td>`).join('')}
    <td>${m.activated ? '<span class="tag" style="background:var(--ok);color:#fff">Activa</span>' : `Código: <span class="code">${esc(m.invite_code || '—')}</span>`}</td>
    <td>${m.email.toLowerCase() !== S.me.email.toLowerCase() ? `<button class="btn sm" data-reset="${esc(m.email)}">Reiniciar acceso</button>` : ''}</td></tr>`).join('')}
  </tbody></table></div>`;
  box.querySelectorAll('[data-sp]').forEach((c) => c.onchange = async () => {
    const row = { space_id: c.dataset.sp, email: c.dataset.em };
    const { error } = c.checked ? await sb.from('space_members').insert(row) : await sb.from('space_members').delete().match(row);
    if (error) { c.checked = !c.checked; return err(error); }
    const sm = await sb.from('space_members').select('*'); S.spaceMembers = sm.data || []; toast('Acceso actualizado');
  });
  box.querySelectorAll('[data-reset]').forEach((bt) => bt.onclick = async () => {
    if (!(await confirmBox('¿Reiniciar el acceso?', `${bt.dataset.reset} dejará de poder entrar con su contraseña actual y tendrá que activar la cuenta otra vez con un código nuevo.`))) return;
    const { data, error } = await sb.functions.invoke('account', { body: { action: 'reset', email: bt.dataset.reset } });
    if (error || data?.error) return err(error || data.error);
    toast('Nuevo código: ' + data.code); renderTeam(el);
  });
}
async function addMember() {
  const name = await ask('Añadir persona', 'Nombre y apellido'); if (!name) return;
  const email = await ask('Añadir persona', 'Email corporativo'); if (!email) return;
  const { error } = await sb.from('members').insert({ email: email.trim().toLowerCase(), name, role: 'member', color: ['#c2410c', '#0f766e', '#9333ea', '#be185d', '#4d7c0f', '#0369a1'][S.members.length % 6] });
  if (error) return err(error);
  const mem = await sb.from('members').select('email,name,role,color,activated'); S.members = mem.data;
  toast('Persona añadida. Marca a qué grupos de trabajo tiene acceso.'); renderMain();
}

/* ---------------- grupos de trabajo ---------------- */
function CTX() { return { S, sb, esc, fmtE, fmtD, ago, board, space, member, topItems, groupOf, optColor, pill, avatar, headHtml, go, openItem, toast, err, saveBoard, renderMain, renderHomeInto }; }
const MARCAS = [{ label: 'OMC', color: '#ff007f' }, { label: 'JLD', color: '#ffcb00' }, { label: 'LLONGUERAS', color: '#037f4c' }, { label: 'FP', color: '#007eb5' }, { label: 'TBC', color: '#cab641' }];
const SPACE_TEMPLATES = {
  expansion: { label: 'Expansión (leads + proyectos con canon y objetivo)', boards: [
    { name: 'Leads', kind: 'leads', columns: [
      { key: 'estado', title: 'Estado', type: 'status', done: ['Listo'], options: [{ label: 'Contactados', color: '#9d50dd' }, { label: 'Llamar de nuevo', color: '#579bfc' }, { label: 'Stand BY', color: '#784bd1' }, { label: 'Descartado', color: '#df2f4a' }, { label: 'Listo', color: '#00c875' }] },
      { key: 'proxima_accion', title: 'Próxima acción', type: 'text' }, { key: 'fecha', title: 'Fecha', type: 'date' },
      { key: 'origen', title: 'Origen', type: 'status', options: [{ label: 'Web', color: '#00c875' }, { label: 'Feria', color: '#ffcb00' }, { label: 'Contactos', color: '#cab641' }, { label: 'Portal de franquicias', color: '#579bfc' }] },
      { key: 'marca', title: 'Marca', type: 'status', options: MARCAS }, { key: 'zona_de_interes', title: 'Zona de interés', type: 'text' },
      { key: 'telefono', title: 'Teléfono', type: 'text' }, { key: 'email', title: 'Email', type: 'text' }, { key: 'capacidad_inversion', title: 'Capacidad inversión', type: 'text' }],
      groups: [{ title: 'Pendiente de contactar', color: '#579bfc' }, { title: '1º filtro', color: '#a25ddc' }, { title: 'Seguimiento', color: '#cab641' }, { title: 'En curso', color: '#00c875' }, { title: 'Stand by', color: '#7f5347' }, { title: 'Firmados', color: '#037f4c', closed: true }, { title: 'Descartados', color: '#df2f4a', closed: true }] },
    { name: 'Proyectos', kind: 'pipeline', columns: [
      { key: 'tipo_de_operacion', title: 'Tipo de operación', type: 'status', options: [{ label: 'Apertura', color: '#00c875' }, { label: 'Traspaso', color: '#fdab3d' }, { label: 'Transformación', color: '#579bfc' }, { label: 'Adquisición', color: '#007eb5' }, { label: 'Renovación', color: '#037f4c' }] },
      { key: 'marca', title: 'Marca', type: 'status', options: MARCAS }, { key: 'canon', title: 'Canon', type: 'number' },
      { key: 'ubicacion', title: 'Ubicación', type: 'text' }, { key: 'contacto', title: 'Contacto', type: 'text' }, { key: 'fecha', title: 'Fecha', type: 'date' }, { key: 'comentarios', title: 'Comentarios', type: 'text' }],
      groups: [{ title: 'Total proyectos', color: '#579bfc' }, { title: 'En negociación', color: '#a25ddc' }, { title: 'Firmado', color: '#00c875', closed: true }, { title: 'Descartados', color: '#df2f4a', closed: true }] }],
    goal: (y) => ({ title: `Canon firmado ${y}`, metric: 'sum', value_key: 'canon', boardIdx: [1], year: y, target: 0 }) },
  obras: { label: 'Obras y proyectos', boards: [{ name: 'Obras', tpl: 'seguimiento' }] },
  tareas: { label: 'Tareas de equipo', boards: [{ name: 'Tareas', tpl: 'tareas' }] },
  blanco: { label: 'En blanco (sin tableros)', boards: [] },
};
async function newSpace() {
  if (S.me.role !== 'admin') return;
  const people = S.members.filter((m) => m.role !== 'admin');
  const v = await formModal('Nuevo grupo de trabajo', `
    <label class="field"><span>Nombre</span><input name="name" required placeholder="p. ej. Marketing, Formación, Aperturas 2027"></label>
    <label class="field"><span>Descripción (opcional)</span><input name="description"></label>
    <label class="field"><span>Plantilla</span><select name="tpl">${Object.entries(SPACE_TEMPLATES).map(([k, t]) => `<option value="${k}">${esc(t.label)}</option>`).join('')}</select></label>
    <div class="field"><span>Personas con acceso (tú entras siempre)</span><div style="display:flex;gap:12px;flex-wrap:wrap;font-size:14px">${people.map((m) => `<label><input type="checkbox" name="p_${esc(m.email)}"> ${esc(m.name)}</label>`).join('') || '<span class="sub">Da de alta personas en «Equipo y accesos».</span>'}</div></div>
    <p class="msg" style="margin:0">Después podrás añadir tableros, cambiar columnas y fases, y poner objetivos desde su Resumen.</p>`, 'Crear grupo de trabajo');
  if (!v || !v.name.trim()) return;
  const name = v.name.trim();
  let id = name.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'grupo';
  for (let i = 2; S.spaces.some((x) => x.id === id); i++) id = id.replace(/-\d+$/, '') + '-' + i;
  const t = SPACE_TEMPLATES[v.tpl];
  try {
    const { data: sp, error } = await sb.from('spaces').insert({ id, name, description: v.description?.trim() || null, icon: v.tpl, sort: Math.max(0, ...S.spaces.map((x) => x.sort || 0)) + 1, settings: { template: v.tpl } }).select().single();
    if (error) throw error;
    S.spaces.push(sp);
    const emails = Object.keys(v).filter((k) => k.startsWith('p_')).map((k) => k.slice(2));
    if (emails.length) { const { error: e2 } = await sb.from('space_members').insert(emails.map((email) => ({ space_id: id, email }))); if (e2) throw e2; S.spaceMembers.push(...emails.map((email) => ({ space_id: id, email }))); }
    const made = [];
    let sort = Math.max(0, ...S.boards.map((b) => b.sort || 0));
    for (const bd of t.boards) {
      const base = bd.tpl ? TEMPLATES[bd.tpl] : bd;
      const row = { space_id: id, name: bd.name, kind: base.kind, columns: base.columns, groups: base.groups.map((g) => ({ id: gid(), ...g, closed: !!g.closed })), sub_columns: SUB_DEFAULT, sort: ++sort };
      const { data, error: e3 } = await sb.from('boards').insert(row).select().single(); if (e3) throw e3;
      if (!board(data.id)) S.boards.push(data); made.push(data);
    }
    if (t.goal && made.length) {
      const g = t.goal(new Date().getFullYear());
      const { error: e4 } = await sb.from('goals').insert({ space_id: id, title: g.title, metric: g.metric, value_key: g.value_key, board_ids: g.boardIdx.map((i) => made[i]?.id).filter(Boolean), year: g.year, target: g.target });
      if (e4) throw e4; await RS.loadGoals(CTX());
    }
    toast('Grupo de trabajo creado'); location.hash = 'space-' + id;
  } catch (e) { err(e); }
}

boot();
