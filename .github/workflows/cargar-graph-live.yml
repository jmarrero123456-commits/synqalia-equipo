# Una sola vez: añade <script src="graph-live.js"> a mi.html (justo después de notas.js) y se borra a sí mismo.
name: cargar graph-live.js en mi.html
on:
  push:
    paths: ['.github/workflows/cargar-graph-live.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  editar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar la línea
        run: |
          if ! grep -q 'src="graph-live.js"' mi.html; then
            sed -i 's#<script src="notas.js" defer></script>#<script src="notas.js" defer></script>\n<script src="graph-live.js" defer></script>#' mi.html
          fi
          grep -n 'graph-live.js' mi.html
          git rm -q .github/workflows/cargar-graph-live.yml
          git config user.name "synqalia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mi.html
          git commit -m "mi.html: carga graph-live.js (Microsoft 365 en directo)"
          git push
